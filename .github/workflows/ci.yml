name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Tests (offline)
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser cache upgrade regression
        run: node --test tests/service_worker.test.cjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml with the example settings
        run: cp .env.example .env && docker compose config --quiet
      - name: Build the app image
        run: docker build --tag ai-trader:ci .
