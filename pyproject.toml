[project]
name = "ai-trader"
version = "0.1.0"
description = "Private, self-hosted AI trading assistant for an Interactive Brokers account"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"trader/broker/sim.py" = ["S311"]
"trader/backtest.py" = ["S311"]
